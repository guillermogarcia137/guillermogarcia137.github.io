<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navbar responsive</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }
  header {
    position: sticky;
    top: 0;
    background: #1e293b;
    color: white;
  }
  nav {
    max-width: 1000px;
    margin: auto;
    padding: 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  .logo { font-weight: bold; font-size: 1.3rem; }
  #toggle { display: none; }
  .burger { display: none; font-size: 1.8rem; cursor: pointer; }
  ul { list-style: none; display: flex; gap: 1.5rem; padding: 0; }
  a { color: #cbd5e1; text-decoration: none; transition: color .2s; }
  a:hover { color: white; }

  @media (max-width: 640px) {
    .burger { display: block; }
    ul {
      width: 100%;
      flex-direction: column;
      gap: 0;
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s;
    }
    li a { display: block; padding: .8rem 0; }
    #toggle:checked ~ ul { max-height: 300px; }
  }
  main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; height: 150vh; }
</style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">MiWeb</span>
      <input type="checkbox" id="toggle">
      <label for="toggle" class="burger">☰</label>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Blog</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
  </header>
  <main><h1>Reduce el ancho de la ventana para ver el menú móvil</h1></main>
</body>
</html>
