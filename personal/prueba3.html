<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Neón</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 3rem;
    align-items: center;
    justify-content: center;
    background: #0a0a0f;
  }
  .neon {
    padding: 1rem 2.5rem;
    font-size: 1.2rem;
    color: #0ff;
    background: transparent;
    border: 2px solid #0ff;
    border-radius: 8px;
    cursor: pointer;
    text-shadow: 0 0 8px #0ff;
    box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
    transition: .3s;
  }
  .neon:hover {
    color: #000;
    background: #0ff;
    box-shadow: 0 0 40px #0ff, 0 0 80px #0ff;
  }
  .loader {
    width: 60px;
    height: 60px;
    border: 6px solid #222;
    border-top-color: #f0f;
    border-radius: 50%;
    animation: gira 1s linear infinite;
    filter: drop-shadow(0 0 8px #f0f);
  }
  @keyframes gira { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <button class="neon">Pulsa aquí</button>
  <div class="loader"></div>
</body>
</html>
