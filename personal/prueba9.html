<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabs</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 2rem 1rem; }
  .tabs { max-width: 560px; margin: auto; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.08); }
  .tabs input { display: none; }
  .barra { display: flex; background: #e2e8f0; }
  .barra label {
    flex: 1;
    text-align: center;
    padding: 1rem;
    cursor: pointer;
    font-weight: 600;
    color: #64748b;
    transition: background .2s, color .2s;
  }
  .barra label:hover { background: #cbd5e1; }
  .panel { display: none; padding: 1.5rem; line-height: 1.6; }

  #t1:checked ~ .barra label[for="t1"],
  #t2:checked ~ .barra label[for="t2"],
  #t3:checked ~ .barra label[for="t3"] { background: white; color: #4f46e5; }

  #t1:checked ~ .p1,
  #t2:checked ~ .p2,
  #t3:checked ~ .p3 { display: block; }
</style>
</head>
<body>
  <div class="tabs">
    <input type="radio" name="tab" id="t1" checked>
    <input type="radio" name="tab" id="t2">
    <input type="radio" name="tab" id="t3">
    <div class="barra">
      <label for="t1">Descripción</label>
      <label for="t2">Características</label>
      <label for="t3">Opiniones</label>
    </div>
    <div class="panel p1">Aquí va la descripción del producto.</div>
    <div class="panel p2">Aquí van las características técnicas.</div>
    <div class="panel p3">Aquí van las opiniones de clientes.</div>
  </div>
</body>
</html>
