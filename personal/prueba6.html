<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f1f5f9;
    padding: 2rem 1rem;
  }
  .faq { max-width: 600px; margin: auto; }
  details {
    background: white;
    border-radius: 12px;
    margin-bottom: .8rem;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    overflow: hidden;
  }
  summary {
    padding: 1.1rem 1.3rem;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
    display: flex;
    justify-content: space-between;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 1.4rem; transition: transform .3s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { padding: 0 1.3rem 1.2rem; color: #475569; line-height: 1.6; }
</style>
</head>
<body>
  <div class="faq">
    <h1>Preguntas frecuentes</h1>
    <details>
      <summary>¿Cuánto tarda el envío?</summary>
      <p>Entre 24 y 48 horas en península.</p>
    </details>
    <details>
      <summary>¿Puedo devolver un producto?</summary>
      <p>Sí, tienes 30 días para devolverlo sin dar explicaciones.</p>
    </details>
    <details>
      <summary>¿Qué métodos de pago aceptáis?</summary>
      <p>Tarjeta, PayPal y transferencia bancaria.</p>
    </details>
  </div>
</body>
</html>
