<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucía Ferrer · Enlaces</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem;
    font-family: "Trebuchet MS", system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(circle at 15% 20%, #ff9a8b 0, transparent 40%),
      radial-gradient(circle at 85% 30%, #8e6bff 0, transparent 45%),
      radial-gradient(circle at 50% 95%, #2ec4b6 0, transparent 45%),
      #1d1033;
  }
  .perfil { width: min(380px, 100%); text-align: center; }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 1rem; border-radius: 50%;
    display: grid; place-items: center; font-size: 2.6rem; font-weight: bold;
    background: linear-gradient(135deg, #ffd6a5, #ff7eb3);
    box-shadow: 0 0 0 5px rgba(255,255,255,.25), 0 12px 30px rgba(0,0,0,.35);
  }
  h1 { font-size: 1.7rem; }
  .bio { margin: .5rem 0 2rem; color: #e9defa; }
  a.enlace {
    position: relative; display: block; margin-bottom: .9rem; padding: 1rem 1.2rem;
    color: #fff; text-decoration: none; font-weight: 600; border-radius: 16px; overflow: hidden;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
    backdrop-filter: blur(12px); transition: transform .25s, color .25s;
  }
  a.enlace::before {
    content: ""; position: absolute; inset: 0; background: #fff; transform: translateX(-101%);
    transition: transform .35s cubic-bezier(.2,.7,.2,1); z-index: -1;
  }
  a.enlace:hover { transform: scale(1.03); color: #1d1033; }
  a.enlace:hover::before { transform: none; }
  a.enlace:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  a.principal { background: #fff; color: #1d1033; }
  a.principal::before { background: #ffd6a5; }
</style>
</head>
<body>
  <main class="perfil">
    <div class="avatar">L</div>
    <h1>Lucía Ferrer</h1>
    <p class="bio">Ilustradora en Valencia. Cuadernos, carteles y encargos para marcas pequeñas.</p>
    <a class="enlace principal" href="#">Reservar un encargo</a>
    <a class="enlace" href="#">Portfolio</a>
    <a class="enlace" href="#">Tienda de láminas</a>
    <a class="enlace" href="#">Newsletter mensual</a>
    <a class="enlace" href="#">Instagram</a>
  </main>
</body>
</html>
