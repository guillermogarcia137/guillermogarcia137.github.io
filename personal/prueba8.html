<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f8fafc;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
  }
  form {
    width: min(380px, 92vw);
    background: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.08);
  }
  label { display: block; margin: 1rem 0 .3rem; font-weight: 600; font-size: .9rem; }
  input {
    width: 100%;
    padding: .7rem .9rem;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 1rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99,102,241,.15); }
  input:not(:placeholder-shown):valid { border-color: #22c55e; }
  input:not(:placeholder-shown):invalid { border-color: #ef4444; }
  .error { display: none; color: #ef4444; font-size: .8rem; margin-top: .3rem; }
  input:not(:placeholder-shown):invalid + .error { display: block; }
  button {
    width: 100%;
    margin-top: 1.5rem;
    padding: .8rem;
    border: 0;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { background: #4f46e5; }
</style>
</head>
<body>
  <form>
    <h2>Crear cuenta</h2>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder=" " required>
    <span class="error">Introduce un email válido</span>

    <label for="pass">Contraseña</label>
    <input type="password" id="pass" placeholder=" " minlength="8" required>
    <span class="error">Mínimo 8 caracteres</span>

    <button type="submit">Registrarme</button>
  </form>
</body>
</html>
