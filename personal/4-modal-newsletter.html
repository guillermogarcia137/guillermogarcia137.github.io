<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modal sin JavaScript</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem;
    font-family: system-ui, sans-serif; color: #1e1b3a;
    background: linear-gradient(120deg, #fdf2f8, #e0e7ff);
  }
  h1 { font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 1rem; }
  .btn {
    display: inline-block; padding: .9rem 1.8rem; border: 0; border-radius: 999px; cursor: pointer;
    background: #4f46e5; color: #fff; font: 600 1rem system-ui; text-decoration: none;
    box-shadow: 0 8px 20px rgba(79,70,229,.35); transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(79,70,229,.45); }

  .modal {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 1rem;
    background: rgba(30,27,58,.45); backdrop-filter: blur(8px);
    opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s;
  }
  .modal:target { opacity: 1; visibility: visible; }
  .cerrar-fondo { position: absolute; inset: 0; }
  .caja {
    position: relative; width: min(420px, 100%); padding: 2.4rem 2rem 2rem; text-align: left;
    background: #fff; border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.3);
    transform: translateY(30px) scale(.96); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .modal:target .caja { transform: none; }
  .x {
    position: absolute; top: .9rem; right: 1.1rem; font-size: 1.8rem; line-height: 1;
    color: #9a98b5; text-decoration: none;
  }
  .x:hover { color: #1e1b3a; }
  .caja h2 { margin-bottom: .5rem; }
  .caja p { color: #5d5a7a; margin-bottom: 1.4rem; }
  input {
    width: 100%; padding: .85rem 1rem; margin-bottom: .9rem; border: 2px solid #e2e0f0; border-radius: 12px;
    font-size: 1rem; transition: border-color .2s, box-shadow .2s;
  }
  input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79,70,229,.15); }
  .caja .btn { width: 100%; }
  small { display: block; margin-top: .9rem; color: #9a98b5; text-align: center; }
</style>
</head>
<body>
  <main>
    <h1>Un correo al mes, nada más</h1>
    <a class="btn" href="#suscripcion">Quiero suscribirme</a>
  </main>

  <div class="modal" id="suscripcion">
    <a class="cerrar-fondo" href="#" aria-label="Cerrar"></a>
    <div class="caja" role="dialog" aria-labelledby="t">
      <a class="x" href="#" aria-label="Cerrar">×</a>
      <h2 id="t">Recibe lo mejor del mes</h2>
      <p>Un resumen con artículos, recursos y novedades. Puedes darte de baja cuando quieras.</p>
      <form>
        <input type="email" placeholder="tu@email.com" required>
        <button class="btn" type="submit">Suscribirme</button>
      </form>
      <small>Pulsa fuera de la ventana para cerrarla.</small>
    </div>
  </div>
</body>
</html>
